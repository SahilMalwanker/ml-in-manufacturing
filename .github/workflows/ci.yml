name: Python Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.10', '3.12', '3.14']
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Format
        run: python -m ruff format --check --no-cache .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Command-line smoke test
        run: ml-manufacturing --help
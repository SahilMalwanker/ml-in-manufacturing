<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sequence diagram: SIMIT, shared memory, the DAQ client and the PLC telemetry during one twin recording"
     width="1200" height="694" viewBox="0 0 1200 694">
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
.rise { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.kicker { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #5EEAD4; }
.legend { font-size: 13px; fill: #94A3B8; }

.caption { font-size: 16px; fill: #B6C2CF; }
.head { fill: #FFFFFF; fill-opacity: .05; stroke: #FFFFFF; stroke-opacity: .12; }
.head-title { font-size: 17px; font-weight: 700; fill: #F8FAFC; }
.head-note { font-size: 13.5px; fill: #94A3B8; }
.life { stroke: #FFFFFF; stroke-opacity: .16; stroke-dasharray: 4 6; }
.msg { fill: none; stroke-width: 2; }
.label { font-size: 15px; fill: #E2E8F0; }
.byte { font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; font-weight: 700; }
.pill { fill: #0D1B26; stroke-width: 1.5; }
.pill-text { font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
.note { font-size: 15px; fill: #B6C2CF; }
.band { fill: #2DD4BF; fill-opacity: .08; }
.foot { font-size: 13.5px; fill: #7F92A6; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F2E35"/>
</linearGradient>
<linearGradient id="accent" x1="0" x2="1">
<stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#FB923C"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
</pattern>
<filter id="soft" x="-2" y="-2" width="5" height="5">
<feGaussianBlur stdDeviation="2.2" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="card"><rect width="1200" height="694" rx="18"/></clipPath>

</defs>
<g clip-path="url(#card)">
<rect width="1200" height="694" fill="url(#bg)"/>
<rect width="1200" height="694" fill="url(#grid)"/>

<text x="40" y="50" class="kicker rise">HOW A DIGITAL-TWIN RUN IS RECORDED</text>
<text x="40" y="76" class="caption rise" style="animation-delay:.1s">SIMIT and the DAQ client hand over control through shared-memory bytes; the shuttle signal in the PLC telemetry starts and stops each recording</text>

<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data flow: the real plant and the digital twin publish PLC telemetry over MQTT for training and live detection"
     width="1200" height="340" viewBox="0 0 1200 340">
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
.rise { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.kicker { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #5EEAD4; }
.legend { font-size: 13px; fill: #94A3B8; }

.card { fill: #FFFFFF; fill-opacity: .05; stroke: #FFFFFF; stroke-opacity: .1; }
.card-title { font-size: 17px; font-weight: 700; fill: #F8FAFC; }
.card-note { font-size: 13px; fill: #94A3B8; }
.edge { fill: none; stroke: #CBD5E1; stroke-opacity: .35; stroke-width: 1.6; }
.bundle { fill: none; stroke: #5EEAD4; stroke-opacity: .7; stroke-width: 1.6; stroke-dasharray: 6 6;
          animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -12; } }
.blink { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .2; } }
.note { font-size: 12.5px; font-style: italic; fill: #94A3B8; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F2E35"/>
</linearGradient>
<linearGradient id="accent" x1="0" x2="1">
<stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#FB923C"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
</pattern>
<filter id="soft" x="-2" y="-2" width="5" height="5">
<feGaussianBlur stdDeviation="2.2" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
<linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#FB923C"/>
</linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 1 L8 5 L0 9 z" fill="#CBD5E1" fill-opacity=".6"/>
</marker>
<marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 1 L8 5 L0 9 z" fill="#5EEAD4"/>
</marker>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#grid)"/>

<text x="24" y="52" class="kicker rise">HOW IT FITS TOGETHER</text>
<text x="1068" y="52" class="legend">shared pipeline</text><circle cx="1057" cy="47" r="5" fill="url(#accent)"/><text x="945.6" y="52" class="legend">digital twin</text><circle cx="934.6" cy="47" r="5" fill="#FB923C"/><text x="837.6" y="52" class="legend">real plant</text><circle cx="826.6" cy="47" r="5" fill="#2DD4BF"/>
<path d="M224 133 C242 133 242 203 260 203" class="edge" marker-end="url(#arrow)"/><path d="M224 273 C242 273 242 203 260 203" class="edge" marker-end="url(#arrow)"/><path d="M460 203 C478 203 478 203 496 203" class="edge" marker-end="url(#arrow)"/><path d="M696 203 C714 203 714 133 732 133" class="edge" marker-end="url(#arrow)"/><path d="M696 203 C714 203 714 273 732 273" class="edge" marker-end="url(#arrow)"/><path d="M932 133 C950 133 950 133 968 133" class="edge" marker-end="url(#arrow)"/><path d="M932 273 C950 273 950 273 968 273" class="edge" marker-end="url(#arrow)"/>
<path d="M1010 170 C1010 206 870 200 870 236" class="bundle" marker-end="url(#arrowTeal)"/>
<text x="1022" y="211" class="note">detector bundle</text>
<g class="rise" style="animation-delay:0.05s"><rect x="24" y="96" width="200" height="74" rx="14" class="card"/><rect x="24" y="110" width="4" height="46" rx="2" fill="#2DD4BF"/><text x="44" y="128" class="card-title">Real plant</text><text x="44" y="150" class="card-note">ST60 · S7-1500 PLC</text></g><g class="rise" style="animation-delay:0.13s"><rect x="24" y="236" width="200" height="74" rx="14" class="card"/><rect x="24" y="250" width="4" height="46" rx="2" fill="#FB923C"/><text x="44" y="268" class="card-title">Digital twin</text><text x="44" y="290" class="card-note">NX MCD · SIMIT · PLCSIM</text></g><g class="rise" style="animation-delay:0.21s"><rect x="260" y="166" width="200" height="74" rx="14" class="card"/><rect x="260" y="180" width="4" height="46" rx="2" fill="url(#accentV)"/><text x="280" y="198" class="card-title">PLC telemetry</text><text x="280" y="220" class="card-note">51 signals per message</text></g><g class="rise" style="animation-delay:0.29s"><rect x="496" y="166" width="200" height="74" rx="14" class="card"/><rect x="496" y="180" width="4" height="46" rx="2" fill="url(#accentV)"/><text x="516" y="198" class="card-title">MQTT broker</text><text x="516" y="220" class="card-note">Mosquitto · port 1883</text></g><g class="rise" style="animation-delay:0.37s"><rect x="732" y="96" width="200" height="74" rx="14" class="card"/><rect x="732" y="110" width="4" height="46" rx="2" fill="url(#accentV)"/><text x="752" y="128" class="card-title">Recordings</text><text x="752" y="150" class="card-note">97 event-driven runs</text></g><g class="rise" style="animation-delay:0.45s"><rect x="732" y="236" width="200" height="74" rx="14" class="card"/><rect x="732" y="250" width="4" height="46" rx="2" fill="url(#accentV)"/><text x="752" y="268" class="card-title">Live detector</text><text x="752" y="290" class="card-note">3-message window</text></g><g class="rise" style="animation-delay:0.53s"><rect x="968" y="96" width="200" height="74" rx="14" class="card"/><rect x="968" y="110" width="4" height="46" rx="2" fill="url(#accentV)"/><text x="988" y="128" class="card-title">Training</text><text x="988" y="150" class="card-note">scaler + classifier</text></g><g class="rise" style="animation-delay:0.61s"><rect x="968" y="236" width="200" height="74" rx="14" class="card"/><rect x="968" y="250" width="4" height="46" rx="2" fill="url(#accentV)"/><text x="988" y="268" class="card-title">Prediction</text><text x="988" y="290" class="card-note">console · JSON topic</text></g>
<circle r="3.6" fill="#5EEAD4" filter="url(#soft)"><animateMotion path="M224 133 C242 133 242 203 260 203" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#FDBA74" filter="url(#soft)"><animateMotion path="M224 273 C242 273 242 203 260 203" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#F8FAFC" filter="url(#soft)"><animateMotion path="M460 203 C478 203 478 203 496 203" dur="1.6s" begin="-0.3s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#F8FAFC" filter="url(#soft)"><animateMotion path="M696 203 C714 203 714 133 732 133" dur="1.6s" begin="-0.6s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#F8FAFC" filter="url(#soft)"><animateMotion path="M696 203 C714 203 714 273 732 273" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#5EEAD4" filter="url(#soft)"><animateMotion path="M932 133 C950 133 950 133 968 133" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#5EEAD4" filter="url(#soft)"><animateMotion path="M932 273 C950 273 950 273 968 273" dur="1.6s" begin="-0.2s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#FDBA74" filter="url(#soft)"><animateMotion path="M932 273 C950 273 950 273 968 273" dur="1.6s" begin="-1.0s" repeatCount="indefinite"/></circle>
<circle cx="914" cy="252" r="4.5" fill="#2DD4BF" class="blink"/>

</g>
</svg>

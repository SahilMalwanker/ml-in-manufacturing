.cmd { fill: #E2E8F0; }
.prompt { fill: #2DD4BF; font-weight: 700; }
.tag { fill: #7F92A6; }
.normal { fill: #5EEAD4; font-weight: 700; }
.fault { fill: #FDBA74; font-weight: 700; }
.dim { fill: #64748B; }
.caret { fill: #5EEAD4; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.status { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; }
.wire-label { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #94A3B8; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>

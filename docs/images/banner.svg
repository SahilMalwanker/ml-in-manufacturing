<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Machine Learning in Manufacturing: real-plant vs. digital-twin training data for fault detection"
     width="1200" height="360" viewBox="0 0 1200 360">
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
.rise { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.kicker { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #5EEAD4; }
.legend { font-size: 13px; fill: #94A3B8; }

.title { font-size: 56px; font-weight: 800; letter-spacing: -1px; }
.sub { font-size: 17px; fill: #B6C2CF; }
.chip { fill: #FFFFFF; fill-opacity: .05; stroke: #2DD4BF; stroke-opacity: .45; }
.chip-text { font-size: 15px; font-weight: 600; fill: #E2E8F0; }
.lane { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
.lane-note { font-size: 12px; fill: #7F92A6; }
.frozen { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #FDBA74; }
.trace { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;
         animation: scroll 5s linear infinite; }
@keyframes scroll { to { transform: translateX(-240px); } }
.wire { fill: none; stroke: #CBD5E1; stroke-opacity: .25; stroke-width: 1.6; }
.core { fill: #0D1B26; stroke: #2DD4BF; stroke-width: 2.5; animation: ring 7s infinite; }
.core-text { font-size: 22px; font-weight: 800; letter-spacing: 1px; fill: #F8FAFC; }
.pulse { fill: none; stroke: #2DD4BF; stroke-width: 2; transform-box: fill-box; transform-origin: center;
         animation: pulse 2.4s ease-out infinite, ring 7s infinite; }
@keyframes pulse { from { opacity: .6; } to { transform: scale(1.9); opacity: 0; } }
@keyframes ring { 0%, 56% { stroke: #2DD4BF; } 60%, 96% { stroke: #FB923C; } 100% { stroke: #2DD4BF; } }
.ok { animation: ok 7s infinite; }
.bad { opacity: 0; animation: bad 7s infinite; }
@keyframes ok { 0%, 56% { opacity: 1; } 60%, 96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes bad { 0%, 56% { opacity: 0; } 60%, 96% { opacity: 1; } 100% { opacity: 0; } }
.state { font-size: 14px; font-weight: 800; letter-spacing: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F2E35"/>
</linearGradient>
<linearGradient id="accent" x1="0" x2="1">
<stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#FB923C"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
</pattern>
<filter id="soft" x="-2" y="-2" width="5" height="5">
<feGaussianBlur stdDeviation="2.2" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
<clipPath id="lane"><rect x="1" y="1" width="238" height="62" rx="9"/></clipPath>
<radialGradient id="glow">
<stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shine" x1="0" x2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".42" stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset=".5" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".58" stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;-1 0;1 0;1 0"
 keyTimes="0;.18;.5;1" dur="7s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>

<text x="56" y="84" class="kicker rise">HOCHSCHULE DARMSTADT · AUTFAB ST60 PRESS STATION</text>
<g class="rise" style="animation-delay:.12s">
<text x="53" y="150" class="title" fill="#F8FAFC">Machine Learning</text>
</g>
<g class="rise" style="animation-delay:.24s">
<text x="53" y="212" class="title" fill="url(#accent)">in Manufacturing</text>
<text x="53" y="212" class="title" fill="url(#shine)">in Manufacturing</text>
</g>
<text x="57" y="252" class="sub rise"
 style="animation-delay:.38s">Real-plant vs. digital-twin training data for fault detection</text>
<g class="rise" style="animation-delay:0.55s"><rect x="56" y="284" width="152" height="34" rx="17" class="chip"/><text x="132" y="306" text-anchor="middle" class="chip-text">97 recordings</text></g><g class="rise" style="animation-delay:0.65s"><rect x="220" y="284" width="162" height="34" rx="17" class="chip"/><text x="301" y="306" text-anchor="middle" class="chip-text">51 PLC signals</text></g><g class="rise" style="animation-delay:0.75s"><rect x="394" y="284" width="115" height="34" rx="17" class="chip"/><text x="451.5" y="306" text-anchor="middle" class="chip-text">9 classes</text></g><g class="rise" style="animation-delay:0.85s"><rect x="521" y="284" width="162" height="34" rx="17" class="chip"/><text x="602" y="306" text-anchor="middle" class="chip-text">100 benchmarks</text></g>
<circle cx="1040" cy="183" r="130" fill="url(#glow)"/>

/g><g class="bad"><path d="M0 27.3 H240" class="trace" stroke="#FB923C" style="animation:none"/><text x="230" y="56" text-anchor="end" class="frozen">READING FROZEN AT 63 %</text></g></g></g>
<g transform="translate(700 206)"><text y="-12" class="lane" fill="#FB923C">DIGITAL TWIN</text><text x="240" y="-12" text-anchor="end" class="lane-note">SIMIT · NX MCD</text><rect width="240" height="64" rx="10" fill="#FFFFFF" fill-opacity=".04" stroke="#FB923C" stroke-opacity=".4"/><g clip-path="url(#lane)"><path d="M0 50 L34 50 L52 14 L150 14 L168 50 L274 50 L292 14 L390 14 L408 50 L480 50" class="trace" stroke="#FB923C" style="animation-duration:5.0s"/></g></g>
<path d="M940 128 C975 128 972 176 1000 179" class="wire"/>
<path d="M940 238 C975 238 972 190 1000 187" class="wire"/>
<path d="M1040 223 L1040 258" class="wire"/>
<circle cx="1040" cy="183" r="40" class="pulse"/>
<circle cx="1040" cy="183" r="40" class="core"/>
<text x="1040" y="191" text-anchor="middle" class="core-text">ML</text>
<circle r="3.6" fill="#5EEAD4" filter="url(#soft)"><animateMotion path="M940 128 C975 128 972 176 1000 179" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="3.6" fill="#FDBA74" filter="url(#soft)"><animateMotion path="M940 238 C975 238 972 190 1000 187" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/></circle>
<circle r="3.6" fill="#F8FAFC" filter="url(#soft)"><animateMotion path="M1040 223 L1040 258" dur="1.2s" begin="-0.3s" repeatCount="indefinite"/></circle>
<g class="ok"><rect x="940" y="258" width="200" height="34" rx="17" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF"/><circle cx="964" cy="275" r="5" fill="#2DD4BF"/><text x="1050" y="280" text-anchor="middle" class="state" fill="#5EEAD4">NORMAL</text></g>
<g class="bad"><rect x="940" y="258" width="200" height="34" rx="17" fill="#FB923C" fill-opacity=".14" stroke="#FB923C"/><circle cx="964" cy="275" r="5" fill="#FB923C"/><text x="1050" y="280" text-anchor="middle" class="state" fill="#FDBA74">FAULT DETECTED</text></g>

</g>
</svg>
